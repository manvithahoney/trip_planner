services:
  - type: web
    name: trip-planner-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set this manually in the Render dashboard, never commit it
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
