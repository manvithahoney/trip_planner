services:
  - type: web
    name: trip-planner-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set this manually in the Render dashboard, never commit it
      - key: GEMINI_MODEL
        sync: false   # set manually too -- Gemini model names change over time;
                       # this way a dashboard fix (e.g. after a model retirement)
                       # survives the next git push instead of being reverted to
                       # whatever's hardcoded here. Defaults to gemini-3.8-flash
                       # in app.py if left unset.
