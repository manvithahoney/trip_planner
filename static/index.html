<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14213D; --navy-deep: #0D1729; --parchment: #FAF6EC; --parchment-dim: #F0EADA;
    --brass: #C89B3C; --brass-text: #E8C878; --teal: #3B6E71; --rust: #A8402F;
    --ink: #24211A; --ink-soft: #55503F; --line: #D8CFB5; --focus-ring: #1F6FEB;
    --mono: 'JetBrains Mono', ui-monospace, monospace; --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--navy); font-family: var(--sans); color: var(--ink); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px 48px; }
  header { padding: 22px 4px 16px; color: var(--parchment); }
  header p { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--brass-text); margin: 0 0 4px; }
  header h1 { font-family: var(--mono); font-size: 26px; margin: 0; }
  .status { font-size: 12px; color: #8993B5; margin-top: 6px; }
  .status.error { color: #E8A597; }

  .chat-shell { background: var(--parchment); border-radius: 6px 6px 0 0; padding: 18px 20px 16px; }
  #chat-log { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding: 4px 2px 10px; margin-bottom: 12px; }
  .msg { display: flex; }
  .msg--agent { justify-content: flex-start; }
  .msg--user { justify-content: flex-end; }
  .msg--agent.typing .bubble { font-style: italic; color: var(--ink-soft); }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 10px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
  .msg--agent .bubble { background: var(--navy-deep); color: var(--parchment); border-bottom-left-radius: 2px; }
  .msg--user .bubble { background: #fff; border: 1px solid var(--line); color: var(--ink); border-bottom-right-radius: 2px; }
  #chat-form { display: flex; gap: 8px; }
  #chat-input { flex: 1; font-family: var(--sans); font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; }
  button.primary { font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; background: var(--navy); color: var(--parchment); border: none; border-radius: 3px; padding: 10px 18px; cursor: pointer; }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible, [role="tab"]:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }

  #results { display: none; margin-top: 18px; }
  #results.visible { display: block; }
  .pass { background: var(--navy-deep); color: var(--parchment); padding: 20px 22px 16px; border-radius: 0; }
  .pass__title { font-family: var(--mono); font-weight: 700; font-size: 26px; margin: 0 0 4px; }
  .pass__sub { font-size: 13px; color: #C9CFDE; margin: 0; }
  .tier-badge { display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; background: var(--brass); color: var(--navy-deep); padding: 3px 9px; border-radius: 3px; margin-top: 8px; }
  .cost-strip { background: var(--parchment-dim); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; font-family: var(--mono); }
  .cost-strip strong { color: var(--navy); }
  [role="tablist"] { display: flex; overflow-x: auto; gap: 2px; padding: 14px 18px 0; background: var(--parchment); }
  [role="tab"] { flex: 0 0 auto; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); background: var(--parchment-dim); border: 1px solid var(--line); border-bottom: none; border-radius: 6px 6px 0 0; padding: 8px 13px 10px; cursor: pointer; min-width: 68px; text-align: left; }
  [role="tab"][aria-selected="true"] { background: var(--parchment); border-color: var(--brass); color: var(--navy); box-shadow: 0 -2px 0 var(--brass) inset; }
  [role="tabpanel"] { background: var(--parchment); padding: 16px 20px 24px; }
  .panel__note { font-size: 12.5px; color: var(--ink-soft); font-style: italic; margin: 0 0 12px; padding: 7px 10px; background: rgba(59,110,113,0.08); border-left: 3px solid var(--teal); }
  .activity-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .activity-card { display: flex; justify-content: space-between; background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 11px 14px; font-size: 14px; }
  .activity-card__price { font-family: var(--mono); color: var(--teal); font-size: 13px; }
  footer { text-align: center; color: #8993B5; font-size: 11px; font-family: var(--mono); padding: 16px 20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p>Trip Planner Agent &middot; Gemini-powered</p>
    <h1>Plan a trip</h1>
    <div class="status" id="status">Checking connection&hellip;</div>
  </header>

  <div class="chat-shell">
    <div id="chat-log" role="log" aria-live="polite" aria-label="Trip planning conversation"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" autocomplete="off" placeholder="e.g. Kyoto for 8 days, cultural vibe, $6000 for two of us">
      <button type="submit" class="primary" id="send-btn">Send</button>
    </form>
  </div>

  <div id="results">
    <div class="pass">
      <div class="pass__title" id="dest-title"></div>
      <p class="pass__sub" id="dest-sub"></p>
      <span class="tier-badge" id="tier-badge"></span>
    </div>
    <div class="cost-strip" id="cost-strip"></div>
    <div role="tablist" aria-label="Itinerary days" id="day-tablist"></div>
    <div id="day-panels"></div>
  </div>

  <footer>Real Gemini function calls &middot; mock flight/hotel/activity inventory.</footer>
</div>

<script>
const SESSION_KEY = "trip-planner-session-id";
let sessionId = sessionStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = crypto.randomUUID();
  sessionStorage.setItem(SESSION_KEY, sessionId);
}

const log = document.getElementById("chat-log");
const form = document.getElementById("chat-form");
const input = document.getElementById("chat-input");
const sendBtn = document.getElementById("send-btn");
const statusEl = document.getElementById("status");

function money(n) { return "$" + Math.round(n).toLocaleString("en-US"); }

function pushMessage(speaker, text) {
  const div = document.createElement("div");
  div.className = `msg msg--${speaker}`;
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function pushTyping() {
  const div = document.createElement("div");
  div.className = "msg msg--agent typing";
  div.innerHTML = `<div class="bubble">Thinking&hellip;</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function checkHealth() {
  try {
    const res = await fetch("/api/health");
    const data = await res.json();
    if (data.gemini_key_set) {
      statusEl.textContent = "Connected.";
    } else {
      statusEl.textContent = "Server is missing GEMINI_API_KEY -- see README_DEPLOY.md.";
      statusEl.classList.add("error");
    }
  } catch (e) {
    statusEl.textContent = "Can't reach the server.";
    statusEl.classList.add("error");
  }
}
checkHealth();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  pushMessage("user", text);
  input.value = "";
  sendBtn.disabled = true;
  const typingEl = pushTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await res.json();
    typingEl.remove();
    if (!res.ok) {
      pushMessage("agent", `Something went wrong: ${data.detail || "unknown error"}`);
      return;
    }
    sessionId = data.session_id;
    sessionStorage.setItem(SESSION_KEY, sessionId);
    pushMessage("agent", data.reply || "(no reply text)");
    if (data.itinerary) renderItinerary(data.itinerary);
  } catch (err) {
    typingEl.remove();
    pushMessage("agent", "Network error -- couldn't reach the server.");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

/* -------- Itinerary rendering (WAI-ARIA Tabs Pattern) -------- */
function renderItinerary(it) {
  document.getElementById("dest-title").textContent = `${it.destination}${it.country ? ", " + it.country : ""}`;
  document.getElementById("dest-sub").textContent =
    `${it.duration_days} days \u00b7 ${it.travelers} traveler${it.travelers > 1 ? "s" : ""} \u00b7 ${it.vibe} vibe`;
  document.getElementById("tier-badge").textContent = it.budget_tier;

  const flightCost = it.flight?.total_price_usd || 0;
  const hotelCost = it.hotel?.total_stay_usd || 0;
  const activitiesCost = (it.days || []).reduce((s, d) => s + (d.activities || []).reduce((s2, a) => s2 + (a.price_usd || 0), 0), 0);
  const total = it.estimated_total_cost_usd || (flightCost + hotelCost + activitiesCost);

  document.getElementById("cost-strip").innerHTML = `
    <span>Flight: <strong>${money(flightCost)}</strong> (${it.flight?.carrier || ""})</span>
    <span>Hotel: <strong>${money(hotelCost)}</strong> (${it.hotel?.name || ""})</span>
    <span>Activities: <strong>${money(activitiesCost)}</strong></span>
    <span style="margin-left:auto;">Total: <strong>${money(total)}</strong></span>
  `;

  const tablist = document.getElementById("day-tablist");
  const panelsWrap = document.getElementById("day-panels");
  tablist.innerHTML = "";
  panelsWrap.innerHTML = "";

  (it.days || []).forEach((day, i) => {
    const tabId = `tab-day-${day.day}`, panelId = `panel-day-${day.day}`;
    const tab = document.createElement("button");
    tab.type = "button"; tab.setAttribute("role", "tab"); tab.id = tabId;
    tab.setAttribute("aria-controls", panelId);
    tab.setAttribute("aria-selected", i === 0 ? "true" : "false");
    tab.tabIndex = i === 0 ? 0 : -1;
    tab.textContent = `Day ${day.day}`;
    tab.addEventListener("click", () => activateTab(i));
    tab.addEventListener("keydown", (e) => handleTabKeydown(e, i));
    tablist.appendChild(tab);

    const panel = document.createElement("section");
    panel.setAttribute("role", "tabpanel"); panel.id = panelId;
    panel.setAttribute("aria-labelledby", tabId); panel.tabIndex = 0;
    panel.hidden = i !== 0;
    let inner = "";
    if (day.note) inner += `<p class="panel__note">${day.note}</p>`;
    inner += '<ul class="activity-list">';
    (day.activities || []).forEach(a => {
      inner += `<li class="activity-card"><span>${a.name}</span><span class="activity-card__price">${money(a.price_usd || 0)}</span></li>`;
    });
    inner += "</ul>";
    panel.innerHTML = inner;
    panelsWrap.appendChild(panel);
  });

  window._tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
  window._panels = Array.from(panelsWrap.querySelectorAll('[role="tabpanel"]'));
  document.getElementById("results").classList.add("visible");
}

function activateTab(index) {
  window._tabs.forEach((t, i) => {
    const selected = i === index;
    t.setAttribute("aria-selected", String(selected));
    t.tabIndex = selected ? 0 : -1;
    window._panels[i].hidden = !selected;
  });
  window._tabs[index].focus();
}

function handleTabKeydown(e, index) {
  const count = window._tabs.length;
  let ni = null;
  if (e.key === "ArrowRight") ni = (index + 1) % count;
  else if (e.key === "ArrowLeft") ni = (index - 1 + count) % count;
  else if (e.key === "Home") ni = 0;
  else if (e.key === "End") ni = count - 1;
  else return;
  e.preventDefault();
  activateTab(ni);
}

pushMessage("agent", "Hi! Tell me about the trip you have in mind \u2014 where, how many days, your budget, and the vibe (relaxing, adventurous, or cultural).");
</script>
</body>
</html>
